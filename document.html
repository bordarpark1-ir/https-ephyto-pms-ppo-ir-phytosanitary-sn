<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phytosanitary Certificate</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#e9ece9;color:#222;margin:0;padding:24px}.sheet{max-width:900px;margin:0 auto;background:white;padding:36px 42px;box-shadow:0 2px 14px #0002;border:1px solid #ddd}.head{display:flex;align-items:center;gap:18px;border-bottom:3px solid #087d3a;padding-bottom:18px}.head img{width:90px;height:90px;object-fit:contain}.brand{color:#087d3a;font-weight:bold}.brand .fa{font-size:20px}.brand .en{font-size:18px;margin-top:5px}.title{text-align:center;margin:22px 0 6px;font-size:24px}.subtitle{text-align:center;color:#555;margin-bottom:24px}.status{text-align:center;background:#e6f4e9;color:#087d3a;padding:10px;font-weight:bold;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #bbb;border-left:1px solid #bbb}.cell{min-height:58px;padding:11px 13px;border-right:1px solid #bbb;border-bottom:1px solid #bbb}.label{color:#555;font-size:12px;text-transform:uppercase;margin-bottom:6px}.value{font-weight:600;overflow-wrap:anywhere}.serial{font-size:18px;color:#087d3a}.foot{margin-top:24px;color:#666;font-size:12px;display:flex;justify-content:space-between}.actions{text-align:center;margin:20px}.actions button{border:0;border-radius:5px;padding:10px 18px;background:#087d3a;color:white;cursor:pointer}@media(max-width:600px){body{padding:8px}.sheet{padding:20px 14px}.grid{grid-template-columns:1fr}.head img{width:68px;height:68px}}@media print{body{background:#fff;padding:0}.sheet{box-shadow:none;border:0;max-width:none}.actions{display:none}}
</style></head><body><main class="sheet"><header class="head"><img src="logo.png" alt="Plant Protection Organization"><div class="brand"><div class="fa" dir="rtl">سازمان حفظ نباتات کشور</div><div class="en">Plant Protection Organization</div></div></header><h1 class="title">PHYTOSANITARY CERTIFICATE</h1><div class="subtitle">Certificate of compliance for plant and plant products</div><div id="content">Loading certificate…</div><div class="foot"><span>Plant Protection Organization</span><span id="serialFoot"></span></div></main><div class="actions"><button onclick="window.print()">Print / Save as PDF</button></div>
<script>const KEY="phyto_demo_records_v2";function esc(v){return String(v||"—").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const sn=new URLSearchParams(location.search).get('sn')||'053554502';
const defaultRecord={serial:'053554502',date:'09/06/2026',place:'Sistan and Baluchestan',exporter:'Persian Gulf Export Co.',importer:'Global Agri Trade Ltd.',commodity:'Fresh Apples (Malus domestica)',quantity:'24,500',unit:'KG (Kilograms)',origin:'Iran (Islamic Republic of)',destination:'India',transport:'Maritime / Sea Freight',treatment:'Cold Treatment at 0°C for 14 days',officer:'M. Hosseini (Senior Quarantine Officer)',status:'APPROVED & ISSUED',botanicalName:'Malus domestica',distinguishingMarks:'Batch #EXP-2026-908'};
let rows=[];try{const raw=localStorage.getItem(KEY);const parsed=raw?JSON.parse(raw):[];if(Array.isArray(parsed))rows=parsed;}catch(e){}
const r=rows.find(x=>String(x.serial)===sn)|| (sn==='053554502'?defaultRecord:null) || rows.find(x=>x.serial);const names=[['serial','Certificate serial number'],['date','Date of issue'],['place','Place of issue'],['exporter','Exporter'],['importer','Importer / consignee'],['commodity','Commodity'],['botanicalName','Botanical name'],['quantity','Quantity'],['unit','Unit'],['origin','Country of origin'],['destination','Country of destination'],['transport','Means of transport'],['treatment','Treatment'],['distinguishingMarks','Distinguishing marks'],['officer','Issuing officer']];if(!r){document.getElementById('content').innerHTML='<p style="text-align:center;color:#a00">Certificate not found. Return to the search page or add it in the admin panel.</p>'}else{document.getElementById('serialFoot').textContent='Serial: '+r.serial;document.getElementById('content').innerHTML='<div class="status">'+esc(r.status||'APPROVED & ISSUED')+'</div><div class="grid">'+names.map(([k,n])=>'<div class="cell"><div class="label">'+n+'</div><div class="value '+(k==='serial'?'serial':'')+'">'+esc(r[k]||(k==='botanicalName'?'': ''))+'</div></div>').join('')+'</div>'}</script></body></html>
