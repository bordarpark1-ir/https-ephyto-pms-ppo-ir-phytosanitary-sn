<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سند گواهی</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#525659}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.frame{max-width:1000px;width:100%;background:white;box-shadow:0 4px 18px #0007}.frame img{display:block;width:100%;height:auto}.empty{padding:36px;text-align:center;font-family:Tahoma,Arial,sans-serif;color:#555}</style></head><body><main class="frame" id="frame"></main><script>const KEY='phyto_demo_records_v2';const sn=new URLSearchParams(location.search).get('sn');let a=[];try{a=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const rec=a.find(x=>x.serial===sn);const frame=document.getElementById('frame');if(rec&&rec.image){const img=document.createElement('img');img.src=rec.image;img.alt='سند گواهی';frame.appendChild(img)}else{const d=document.createElement('div');d.className='empty';d.textContent=sn?'برای این گواهی تصویری ثبت نشده است.':'شماره سریال مشخص نیست.';frame.appendChild(d)}</script></body></html>
