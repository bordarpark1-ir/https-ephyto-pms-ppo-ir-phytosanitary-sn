<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Phytosanitary Certificate Search</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { background-color: #1a5c2a; }
    body {
      color-scheme: light;
      background: #1a5c2a url('bg.jpg') center/cover no-repeat fixed;
      background-color: #fff;
      color: #212121;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    header {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 14px 16px;
      background-color: transparent;
      gap: 12px;
    }
    .logo {
      display: block;
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      border-radius: 50%;
      cursor: pointer;
      object-fit: cover;
    }
    .brand { direction: rtl; text-align: right; }
    .brand-fa {
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.35;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
    .brand-en {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.35;
      white-space: nowrap;
      text-align: right;
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
    .card {
      width: 88%;
      max-width: 340px;
      margin: 15px auto 30px;
      box-sizing: border-box;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.25;
      margin: 0 0 16px 0;
    }
    label {
      font-size: 14px;
      font-weight: 500;
      color: #222;
      margin-bottom: 5px;
      display: block;
    }
    input, select {
      display: block;
      width: 100%;
      height: 42px;
      font-size: 14px;
      color: #333;
      background: #fff;
      border: 1px solid #bcbcbc;
      border-radius: 6px;
      padding: 0 10px;
      box-sizing: border-box;
      margin-bottom: 14px;
    }
    input::placeholder { color: #777; opacity: 1; }
    button {
      display: block;
      width: 100%;
      height: 40px;
      background-color: #5da856;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }
    #result {
      border-top: 1px solid #ccc;
      margin-top: 14px;
      padding-top: 12px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #212121;
      background-color: transparent;
    }
    #result[hidden] { display: none; }
    #result a { color: #0645ad; text-decoration: underline; }
    #result.not-found { color: #a00; }
    @media (max-width: 380px) {
      .card { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="logo.png" alt="Logo" onclick="location.href='admin.html'">
    <div class="brand" dir="rtl">
      <div class="brand-fa">سازمان حفظ نباتات کشور</div>
      <div class="brand-en" dir="ltr">Plant Protection Organization</div>
    </div>
  </header>

  <main class="card">
    <h1>Phytosanitary Certificate Search</h1>
    <form id="searchForm">
      <label for="date">Date</label>
      <input id="date" name="date" type="text" placeholder="09/06/2026" autocomplete="off">

      <label for="place">Place of Issue</label>
      <select id="place" name="place">
        <option value="Sistan and Baluchestan" selected>Sistan and Baluchestan</option>
        <option value="Tehran">Tehran</option>
        <option value="Khorasan Razavi">Khorasan Razavi</option>
        <option value="Khuzestan">Khuzestan</option>
        <option value="Bushehr">Bushehr</option>
        <option value="Hormozgan">Hormozgan</option>
        <option value="Gilan">Gilan</option>
        <option value="Ardabil">Ardabil</option>
        <option value="West Azerbaijan">West Azerbaijan</option>
        <option value="East Azerbaijan">East Azerbaijan</option>
        <option value="Kerman">Kerman</option>
        <option value="Yazd">Yazd</option>
        <option value="Isfahan">Isfahan</option>
        <option value="Fars">Fars</option>
        <option value="Astara">Astara</option>
        <option value="Bazargan">Bazargan</option>
        <option value="Bandar Abbas">Bandar Abbas</option>
        <option value="Jolfa">Jolfa</option>
        <option value="Sarakhs">Sarakhs</option>
        <option value="Milak">Milak</option>
        <option value="Bashmagh">Bashmagh</option>
        <option value="Chabahar">Chabahar</option>
        <option value="Other">Other</option>
      </select>

      <label for="sn">Serial No</label>
      <input id="sn" name="sn" type="text" inputmode="numeric" placeholder="053554502" autocomplete="off">

      <button type="submit">Search</button>
    </form>
    <div id="result" hidden></div>
  </main>

  <script>
    (function () {
      'use strict';
      const STORAGE_KEY = 'phyto_demo_records_v2';
      const form = document.getElementById('searchForm');
      const dateInput = document.getElementById('date');
      const placeInput = document.getElementById('place');
      const serialInput = document.getElementById('sn');
      const result = document.getElementById('result');
      let records = [];

      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
        } else {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) records = parsed;
        }
      } catch (error) {
        records = [];
      }

      const params = new URLSearchParams(window.location.search);
      if (params.has('sn')) serialInput.value = params.get('sn');
      if (params.has('date')) dateInput.value = params.get('date');
      if (params.has('place')) {
        const requestedPlace = params.get('place');
        const matchingOption = Array.from(placeInput.options).find(
          option => option.value.toLowerCase() === requestedPlace.toLowerCase()
        );
        if (matchingOption) placeInput.value = matchingOption.value;
      }

      function showNotFound() {
        result.textContent = 'Certificate not found.';
        result.classList.add('not-found');
        result.hidden = false;
      }

      function search() {
        const sn = serialInput.value.trim();
        const date = dateInput.value.trim();
        const place = placeInput.value.trim();
        if (!sn || !date || !place) {
          window.alert('Please complete all fields.');
          return;
        }

        const match = records.find(record => record &&
          String(record.sn == null ? '' : record.sn).trim().toLowerCase() === sn.toLowerCase() &&
          String(record.date == null ? '' : record.date).trim() === date &&
          String(record.place == null ? '' : record.place).trim().toLowerCase() === place.toLowerCase()
        );

        result.replaceChildren();
        result.classList.remove('not-found');
        if (match) {
          result.append(document.createTextNode('Certificate exists. '));
          const link = document.createElement('a');
          link.href = 'document.html?sn=' + encodeURIComponent(sn);
          link.textContent = '(view document)';
          result.append(link);
          result.hidden = false;
        } else {
          showNotFound();
        }
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        search();
      });
    }());
  </script>
</body>
</html>
