<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت گواهی‌ها</title>
<style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f3f5f4;margin:0;color:#222}.bar{background:#087d3a;color:#fff;padding:18px 24px;font-size:21px}.wrap{max-width:1000px;margin:22px auto;padding:0 14px}.box{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #0002}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input,.grid select{padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px;font-family:inherit}.actions{margin-top:15px;display:flex;gap:8px}button{border:0;border-radius:7px;padding:11px 18px;background:#159447;color:#fff;cursor:pointer;font-family:inherit}button.del{background:#b72c2c}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:right}.hint{color:#555;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.box{overflow:auto}}
</style></head><body><div class="bar">پنل مدیریت گواهی‌ها</div><div class="wrap">
<div class="box"><h2>ثبت / ویرایش گواهی</h2><p class="hint">اطلاعات در حافظه مرورگر همین دستگاه ذخیره می‌شود.</p><div class="grid">
<input id="serial" placeholder="شماره سریال *"><input id="date" placeholder="تاریخ (مثلاً 09/06/2026)"><select id="place"><option>Alborz</option><option>Ardabil</option><option>Bushehr</option><option>Chaharmahal and Bakhtiari</option><option>East Azerbaijan</option><option>Fars</option><option>Gilan</option><option>Golestan</option><option>Hamadan</option><option>Hormozgan</option><option>Ilam</option><option>Isfahan</option><option>Kerman</option><option>Kermanshah</option><option>Khuzestan</option><option>Kohgiluyeh and Boyer-Ahmad</option><option>Kurdistan</option><option>Lorestan</option><option>Markazi</option><option>Mazandaran</option><option>North Khorasan</option><option>Qazvin</option><option>Qom</option><option>Razavi Khorasan</option><option>Semnan</option><option>Sistan and Baluchestan</option><option>South Khorasan</option><option>Tehran</option><option>West Azerbaijan</option><option>Yazd</option><option>Zanjan</option></select>
<input id="exporter" placeholder="فرستنده / صادرکننده"><input id="importer" placeholder="گیرنده / واردکننده"><input id="commodity" placeholder="نوع کالا"><input id="quantity" placeholder="مقدار"><input id="unit" placeholder="واحد"><input id="origin" placeholder="کشور مبدأ"><input id="destination" placeholder="کشور مقصد"><input id="transport" placeholder="وسیله حمل"><input id="treatment" placeholder="روش تیمار"><input id="officer" placeholder="کارشناس صادرکننده"><input id="status" placeholder="وضعیت"><input id="botanicalName" placeholder="نام گیاه‌شناسی"><input id="distinguishingMarks" placeholder="علائم مشخصه">
</div><div class="actions"><button onclick="save()">ذخیره گواهی</button><button onclick="clearForm()">پاک کردن فرم</button><a href="index.html">بازگشت به جست‌وجو</a></div></div>
<div class="box"><h2>فهرست گواهی‌ها</h2><table><thead><tr><th>سریال</th><th>تاریخ</th><th>محل صدور</th><th>کالا</th><th>عملیات</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<script>
const KEY="phyto_demo_records_v2";const fields=["serial","date","place","exporter","importer","commodity","quantity","unit","origin","destination","transport","treatment","officer","status","botanicalName","distinguishingMarks"];
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}function set(a){localStorage.setItem(KEY,JSON.stringify(a));render()}
function save(){let o={};fields.forEach(f=>o[f]=document.getElementById(f).value.trim());if(!o.serial)return alert("شماره سریال را وارد کنید.");let a=get(),i=a.findIndex(x=>x.serial===o.serial);if(i>=0)a[i]=o;else a.unshift(o);set(a);clearForm();alert("گواهی ذخیره شد.")}
function edit(s){let o=get().find(x=>x.serial===s);fields.forEach(f=>document.getElementById(f).value=o[f]||"");scrollTo(0,0)}function del(s){if(confirm("این گواهی حذف شود؟"))set(get().filter(x=>x.serial!==s))}
function clearForm(){fields.forEach(f=>document.getElementById(f).value="")}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById("tbody").innerHTML=get().map(x=>`<tr><td>${esc(x.serial)}</td><td>${esc(x.date)}</td><td>${esc(x.place)}</td><td>${esc(x.commodity)}</td><td><button onclick="edit(${JSON.stringify(x.serial)})">ویرایش</button> <button class="del" onclick="del(${JSON.stringify(x.serial)})">حذف</button></td></tr>`).join("")||'<tr><td colspan="5">هنوز گواهی ثبت نشده است.</td></tr>'}render();
</script></body></html>
