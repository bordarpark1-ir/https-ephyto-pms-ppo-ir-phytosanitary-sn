<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
body{font-family:Arial,Tahoma,sans-serif;background:#f3f5f4;margin:0;color:#222}
.bar{background:#087d3a;color:#fff;padding:18px 24px;font-size:21px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.bar a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:6px;font-size:16px}
.bar a:hover{background:rgba(255,255,255,.3)}
.wrap{max-width:1000px;margin:22px auto;padding:0 14px}
.box{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
h2{margin-top:0;font-size:20px;color:#087d3a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid input,.grid select{padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px;width:100%}
.file-wrap{grid-column:1/-1}
.file-wrap input{padding:8px}
.actions{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:7px;padding:11px 18px;background:#43a047;color:#fff;cursor:pointer;font-size:15px}
button:hover{background:#388e3c}
button.del{background:#b72c2c}
button.ghost{background:#607d8b}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:right;font-size:14px}
th{background:#eef4ef}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:5px;border:1px solid #ccc;cursor:pointer}
.small{font-size:12px;color:#777}
@media(max-width:650px){.grid{grid-template-columns:1fr}.box{overflow:auto}}
</style>
</head>
<body>
<div class="bar">
  <span>پنل مدیریت گواهی‌های بهداشت گیاهی</span>
  <a href="index.html">بازگشت به صفحه جستجو</a>
</div>
<div class="wrap">

<div class="box">
  <h2>افزودن / ویرایش گواهی</h2>
  <div class="grid">
    <input id="serial" placeholder="شماره سریال (Serial No) *">
    <input id="date" placeholder="تاریخ (Date) e.g. 2026-06-09">
    <select id="place">
      <option value="">-- محل صدور (Place of Issue) --</option>
      <option>Sistan and Baluchestan</option><option>Tehran</option><option>Razavi Khorasan</option>
      <option>Khuzestan</option><option>Bushehr</option><option>Hormozgan</option>
      <option>Astara</option><option>Bazargan</option><option>Bandar Abbas</option>
      <option>Jolfa</option><option>Sarakhs</option><option>Bandar Anzali</option>
    </select>
    <input id="commodity" placeholder="کالا (Commodity)">
    <input id="exporter" placeholder="فرستنده (Exporter)">
    <input id="importer" placeholder="گیرنده (Importer)">
    <input id="quantity" placeholder="مقدار (Quantity)">
    <input id="origin" placeholder="مبدأ (Origin)">
    <input id="destination" placeholder="مقصد (Destination)">
    <input id="status" placeholder="وضعیت (Status)">
    <div class="file-wrap">
      <label>تصویر گواهی (اختیاری — به Base64 تبدیل می‌شود):</label>
      <input type="file" id="docImage" accept="image/*">
      <div class="small" id="imgInfo"></div>
    </div>
  </div>
  <div class="actions">
    <button onclick="save()">ذخیره و تولید QR</button>
    <button class="ghost" onclick="clearForm()">پاک کردن فرم</button>
  </div>
</div>

<div class="box" id="qrBox" style="display:none">
  <h2>QR Code گواهی</h2>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <img id="qrImg" alt="QR" style="width:180px;height:180px;border:1px solid #ddd;border-radius:8px">
    <div>
      <div id="qrUrl" class="small" style="margin-bottom:10px"></div>
      <button onclick="downloadQR()">دانلود QR</button>
      <button class="ghost" onclick="viewQR()">مشاهده QR</button>
      <button class="ghost" onclick="document.getElementById('qrBox').style.display='none'">بستن</button>
    </div>
  </div>
</div>

<div class="box">
  <h2>لیست گواهی‌ها</h2>
  <table>
    <thead><tr><th>تصویر</th><th>سریال</th><th>تاریخ</th><th>محل صدور</th><th>کالا</th><th>عملیات</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

</div>
<script>
const KEY = "phyto_demo_records_v2";
let currentQR = { url: "", serial: "" };

function get() {
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch (e) { return []; }
}
function set(a) { localStorage.setItem(KEY, JSON.stringify(a)); render(); }

function save() {
  const o = {};
  ["serial","date","place","commodity","exporter","importer","quantity","origin","destination","status"]
    .forEach(f => o[f] = document.getElementById(f).value.trim());
  if (!o.serial) return alert("شماره سریال الزامی است");
  const f = document.getElementById("docImage").files[0];
  const finish = () => {
    const a = get();
    const i = a.findIndex(x => x.serial === o.serial);
    if (i >= 0) a[i] = Object.assign(a[i], o); else a.unshift(o);
    set(a);
    clearForm();
    makeQR(o.serial, o.date, o.place);
    alert("ذخیره شد");
  };
  if (f) {
    const rd = new FileReader();
    rd.onload = e => { o.docImage = e.target.result; finish(); };
    rd.readAsDataURL(f);
  } else finish();
}

function makeQR(serial, date, place) {
  const base = location.origin + location.pathname.replace("admin.html", "index.html");
  const url = base + "?sn=" + encodeURIComponent(serial) +
              (date ? "&date=" + encodeURIComponent(date) : "") +
              (place ? "&place=" + encodeURIComponent(place) : "");
  currentQR = { url: url, serial: serial };
  document.getElementById("qrImg").src =
    "https://quickchart.io/qr?size=300&margin=1&text=" + encodeURIComponent(url);
  document.getElementById("qrUrl").textContent = url;
  document.getElementById("qrBox").style.display = "block";
  document.getElementById("qrBox").scrollIntoView({ behavior: "smooth" });
}
function downloadQR() {
  const a = document.createElement("a");
  a.href = document.getElementById("qrImg").src;
  a.download = "qr_" + currentQR.serial + ".png";
  a.click();
}
function viewQR() { window.open(document.getElementById("qrImg").src, "_blank"); }
function previewDoc(s) { window.open("document.html?sn=" + encodeURIComponent(s), "_blank"); }

function edit(s) {
  const o = get().find(x => x.serial === s); if (!o) return;
  ["serial","date","place","commodity","exporter","importer","quantity","origin","destination","status"]
    .forEach(f => document.getElementById(f).value = o[f] || "");
  document.getElementById("imgInfo").textContent = o.docImage ? "تصویر موجود است (برای تغییر، فایل جدید انتخاب کنید)" : "";
  scrollTo(0, 0);
}
function del(s) { if (confirm("این گواهی حذف شود؟")) set(get().filter(x => x.serial !== s)); }
function clearForm() {
  ["serial","date","commodity","exporter","importer","quantity","origin","destination","status"]
    .forEach(f => document.getElementById(f).value = "");
  document.getElementById("place").value = "";
  document.getElementById("docImage").value = "";
  document.getElementById("imgInfo").textContent = "";
}
document.getElementById("docImage").addEventListener("change", e => {
  const f = e.target.files[0];
  document.getElementById("imgInfo").textContent = f ? (f.name + " (" + Math.round(f.size/1024) + " KB)") : "";
});

function render() {
  document.getElementById("tbody").innerHTML = get().map(x =>
    '<tr>' +
    '<td>' + (x.docImage ? '<img class="thumb" src="' + x.docImage + '" onclick="previewDoc(\'' + x.serial + '\')">' : '<span class="small">—</span>') + '</td>' +
    '<td>' + x.serial + '</td><td>' + (x.date || "") + '</td><td>' + (x.place || "") + '</td><td>' + (x.commodity || "") + '</td>' +
    '<td>' +
    '<button onclick="edit(\'' + x.serial + '\')">ویرایش</button> ' +
    '<button class="ghost" onclick="makeQR(\'' + x.serial + '\',\'' + (x.date || "") + '\',\'' + (x.place || "") + '\')">QR</button> ' +
    '<button class="ghost" onclick="previewDoc(\'' + x.serial + '\')">پیش‌نمایش</button> ' +
    '<button class="del" onclick="del(\'' + x.serial + '\')">حذف</button>' +
    '</td></tr>'
  ).join("") || '<tr><td colspan="6" class="small">موردی ثبت نشده است</td></tr>';
}
render();
</script>
</body>
</html>
